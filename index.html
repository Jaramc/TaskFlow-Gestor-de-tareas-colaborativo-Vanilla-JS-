<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
        <nav class="col-12 col-md-1 col-lg-2 text-white min-vh-100 p-3 sidebar">
            <div class="logo">
                <img src="Imagenes/Logo.png" alt="TaskFlow Logo" class="logo-img">
            </div>
            
                <h1 class="title">TaskFlow</h1>
            
            <ul class="nav flex-column">
            <li class="nav-item">
                <a href="#" class="nav-link text-white active">
                    <img src="Imagenes/casa.png" alt="Dashboard" class="nav-icon me-2">Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link text-white">
                    <img src="Imagenes/carpeta.png" alt="Projects" class="nav-icon me-2">Projects
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link text-white">
                    <img src="Imagenes/portapapeles.png" alt="Tasks" class="nav-icon me-2">Tasks
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link text-white">
                    <img src="Imagenes/filtrar.png" alt="Filters" class="nav-icon me-2">Filters
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link text-white">
                    <img src="Imagenes/calendario.png" alt="Calendar" class="nav-icon me-2">Calendar
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link text-white">
                    <img src="Imagenes/configuraciones.png" alt="Settings" class="nav-icon me-2">Settings
                </a>
            </li>
            </ul>
        </nav>
        <main class="col-12 col-md-9 col-lg-10 p-4">
            <!-- Header del Dashboard -->
            <header class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1">Hello, <span id="userName">User</span></h1>
                    <time id="currentTime" class="text-muted"></time>
                </div>

                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-outline-secondary">
                        <img src="Imagenes/lupa.png" alt="Search" width="20">
                    </button>
                    <button id="logoutBtn" class="btn btn-outline-danger">
                        <i class="fas fa-sign-out-alt"></i> Sign Out
                    </button>
                </div>
            </header>

            <!-- Sección de tarjetas del dashboard -->
            <div class="container-fluid">
                <div class="row g-4">
                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="card text-center h-100">
                            <div class="card-body">
                                <img src="Imagenes/PruebaDeFotoDeperfil.jpeg" alt="Tasks" class="mb-3" width="60">
                                <h5 class="card-title">All Tasks</h5>
                                <p class="card-text text-muted">Manage all your tasks</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="card text-center h-100">
                            <div class="card-body">
                                <img src="Imagenes/PruebaDeFotoDeperfil.jpeg" alt="Projects" class="mb-3" width="60">
                                <h5 class="card-title">Active Projects</h5>
                                <p class="card-text text-muted">Review your projects</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="card text-center h-100">
                            <div class="card-body">
                                <img src="Imagenes/PruebaDeFotoDeperfil.jpeg" alt="Calendar" class="mb-3" width="60">
                                <h5 class="card-title">Calendar</h5>
                                <p class="card-text text-muted">View upcoming events</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="card text-center h-100">
                            <div class="card-body">
                                <img src="Imagenes/PruebaDeFotoDeperfil.jpeg" alt="Settings" class="mb-3" width="60">
                                <h5 class="card-title">Settings</h5>
                                <p class="card-text text-muted">Adjust your profile</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
