<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="tasks.css">
    <title>Tasks</title>
    
</head>
<body class="bg-light">
    <div class="container-fluid">
        <div class="row min-vh-100">
            <!--SideBar target _self _blank-->
            <aside class="col-12 col-md-2 bg-purple text-white p-4">
                <h4 class="fw-bold mb-5">TaskFLow</h4>
                <nav class="nav flex-column gap-2">
                    <a class="nav-link text-white" href="#">Dashboard</a>
                    <a class="nav-link text-white" href="#">Projects</a>
                    <a class="nav-link text-white active" href="#">Tasks</a>
                    <a class="nav-link text-white" href="#">Filters</a>
                    <a class="nav-link text-white" href="#">Remove Tasks</a>
                    <a class="nav-link text-white" href="#">Settings</a>
                </nav>
            </aside>
            <!--Main-->
            <main class="col-12 col-md-10 p-4">
                <header class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2>Hi, User</h2>
                        <p>Welcome To Us App!</p>
                    </div>
                    <button class="btn add-task-btn" data-bs-toggle="modal" data-bs-target="#taskModal">
                        Add Task
                    </button>
                </header>
                <!--filters-->
                <div class="btn-group mb-3" role="group">
                    <button class="btn btn-outline-secondary filter-btn active" data-filter="All">All</button>
                    <button class="btn btn-outline-secondary filter-btn" data-filter="Pending">Pending</button>
                    <button class="btn btn-outline-secondary filter-btn" data-filter="In Process">In Process</button>
                    <button class="btn btn-outline-secondary filter-btn" data-filter="Complete">Complete</button>
                </div>
                <!--counter-->
                <p class="text-muted mt-3 mb-3 task-counter" id="task-counter">Showing: 0</p>
                <!--Task List-->
                <div class="list-group" id="task-list"></div>
            </main>
        </div>
    </div>
    <!--Modal: add task-->
    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog">
            <form class="modal-content" id="task-form">
                <div class="modal-header">
                    <h5 class="modal-title">Create Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="title" class="form-control mb-3" placeholder="Task Title" required>
                    <input type="text" id="description" class="form-control mb-3" placeholder="Task Description" maxlength="120" required>
                    <select class="form-select" id="priority">
                        <option>Low</option>
                        <option>Medium</option>
                        <option>High</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary w-100" type="submit">Create Task</button>
                </div>
            </form>
        </div>
    </div>
    <script src="tasks.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
