<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título del proyecto -->
    <title>TaskFlow - Filters</title>

    <!-- Enlace al CSS -->
    <link rel="stylesheet" href="css_jose.css">
</head>
<body>
    <main class="page-cont">
        <!-- =========================
            CONTENEDOR GENERAL
        ========================== -->
        <div class="app">

            <!-- =========================
                BARRA LATERAL (SIDEBAR)
            ========================== -->
            <aside class="sidebar">

                <!-- Logo -->
                <div class="logo">
                    <h2>TF</h2>
                    <span>TaskFlow</span>
                </div>

                <!-- Navegación -->
                <nav class="menu">
                    <li class="item">
                        <img src="/assets/img/casa.png" alt="" class="loguito"><a href="#" style="font-weight: 500;">Dashboard</a>
                    </li>

                    <li class="item">
                        <img src="/assets/img/carpeta.png" alt="" class="loguito"><a href="#">Projects</a>
                    </li>

                    <li class="item">
                        <img src="/assets/img/portapapeles.png" alt="" class="loguito"><a href="#">Tasks</a>
                    </li>

                    <li class="item">
                        <img src="/assets/img/filtrar.png" alt="" class="loguito"><a href="#">Filters</a>
                    </li>

                    <li class="item">
                        <img src="/assets/img/calendario.png" alt="" class="loguito"><a href="#">Calendar</a>
                    </li>

                    <li class="item">
                        <img src="/assets/img/configuraciones.png" alt="" class="loguito"><a href="#">Settings</a>
                    </li>
                </nav>

                <!-- Cerrar sesión -->
                <button class="logout">Cerrar sesión</button>
            </aside>

            <!-- =========================
                CONTENIDO PRINCIPAL
            ========================== -->
            <main class="content">

                <!-- =========================
                    CABECERA SUPERIOR
                ========================== -->
                <header class="topbar">
                    <h1>Filters</h1>

                    <!-- Iconos simulados -->
                    <div class="top-actions">
                        <div class="icon"></div>
                        <div class="icon"></div>
                    </div>
                </header>

                <!-- =========================
                    PANEL DE FILTROS
                ========================== -->
                <section class="filter-panel">

                <header class="filter-header">
                    <h3>Conditions</h3>
                    <button class="clear-filters">Clear filters</button>
                </header>

                <div class="filter-row">
                    <div class="toggle-group">
                    <button data-owner="all" class="toggle active">All tasks</button>
                    <button data-owner="mine" class="toggle">Only my tasks</button>
                    </div>
                </div>

                <div class="filter-row grid-2">
                    <div class="filter-block">
                    <h4>Priority</h4>
                    <div class="options">
                        <button data-priority="high" class="chip">High</button>
                        <button data-priority="medium" class="chip">Medium</button>
                        <button data-priority="low" class="chip">Low</button>
                    </div>
                    </div>

                    <div class="filter-block">
                    <h4>Status</h4>
                    <div class="options">
                        <button data-status="pending" class="chip">Pending</button>
                        <button data-status="progress" class="chip">In Progress</button>
                        <button data-status="completed" class="chip">Completed</button>
                    </div>
                    </div>
                </div>
            </section>
            

                <!-- =========================
                    LISTADO DE TAREAS
                ========================== -->
                <section class="tasks">

                    <h2>All Tasks</h2>
                    <p class="subtitle">Selecciona condiciones para filtrar la lista</p>

                    <!-- ⚠️ ESPACIO PARA TUS TAREAS -->
                    <!-- =====================================================
                        AQUÍ PUEDES PEGAR:
                        - cards
                        - listas
                        - tablas
                        - componentes dinámicos
                    ====================================================== -->
                    <section class="task-list">
                        <ul class="tasks" id="tasks"></ul>

                    </section>

                </section>

            </main>
        </div>

    </main>
    <script src="js_jose.js"></script>
</body>
</html>
