<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css_jose.css">
    <title>Pruebita Animaciones</title>
</head>
<body>
    <main>
        <Section class="container-checkbox">
            <h1 class="t-container">Filtrar tareas</h1>
            <article class="priority">
                <legend class="t-type-filter">Filtrar por prioridad</legend>
                <div class="priority-body">
                    <form action="#" class="checkboxlist">
                        
                        <fieldset>

                            <label>
                                <input type="checkbox" name="intereses" value="musica">
                                Música
                            </label> 
                            <br>
                            <label>
                                <input type="checkbox" name="intereses" value="cine">
                                Cine
                            </label>
                            <br>
                            <label style="margin-bottom: 30px;">
                                <input type="checkbox" name="intereses" value="tecnologia">
                                Tecnología
                            </label>
                        </fieldset>

                    </form>
                </div>
            </article>
            <article class="status">
                <h3 class="t-type-filter">Filtrar por estado</h3>
            </article>
        </Section>
    </main>
</body>
</html>
