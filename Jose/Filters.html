<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título del proyecto -->
    <title>TaskFlow - Filters</title>

    <!-- Enlace al CSS -->
    <link rel="stylesheet" href="css_jose.css">
</head>
<body style="background-color: white;"> 
    <main class="page-cont">
        <!-- =========================
            CONTENEDOR GENERAL
        ========================== -->
        <div class="app">

            <!-- =========================
                BARRA LATERAL (SIDEBAR)
            ========================== -->
            <aside class="sidebar">

                <!-- Logo -->
                <div class="logo">
                    <img src="../assets/img/tf.svg" class="loguito2" alt="">
                    <span>TaskFlow</span>
                </div>

                <!-- Navegación -->
                <nav class="menu">
                    <li class="item">
                        <img src="../assets/img/casa.png" alt="" class="loguito"><a href="../index.html" style="font-weight: 500;">Dashboard</a>
                    </li>

                    <li class="item">
                        <img src="../assets/img/carpeta.png" alt="" class="loguito"><a href="#">Projects</a>
                    </li>

                    <li class="item">
                        <img src="../assets/img/portapapeles.png" alt="" class="loguito"><a href="../Fb/tasks.html">Tasks</a>
                    </li>

                    <li class="item">
                        <img src="../assets/img/filtrar.png" alt="" class="loguito"><a href="Filters.html">Filters</a>
                    </li>

                    <li class="item">
                        <img src="../assets/img/calendario.png" alt="" class="loguito"><a href="../index.html#calendar">Calendar</a>
                    </li>

                    <li class="item">
                        <img src="../assets/img/configuraciones.png" alt="" class="loguito"><a href="#">Settings</a>
                    </li>
                </nav>

                <!-- Cerrar sesión -->
                <button class="logout" onclick="logOut()">Cerrar sesión</button>
            </aside>

            <!-- =========================
                CONTENIDO PRINCIPAL
            ========================== -->
            <main class="content">

                <!-- =========================
                    CABECERA SUPERIOR
                =========================== -->
                <header class="topbar">
                    <h1>Filters</h1>

                    <!-- Iconos simulados -->
                    <div class="top-actions">
                        <div class="icon">
                            <img src="../assets/img/search-svgrepo-com.svg" alt="Icono" class="my-icon">
                        </div>
                        
                        <div class="icon">
                            <img src="../assets/img/hamburger-menu-svgrepo-com.svg" alt="Icono" class="my-icon">

                        </div>
                    </div>
                </header>

                <!-- =========================
                    PANEL DE FILTROS
                ========================== -->
                <section class="filter-panel">

                <header class="filter-header">
                    <h3>Conditions</h3>
                    <button class="clear-filters" style="color: #8F4F82;">Clear filters</button>
                </header>

                <div class="filter-row">
                    <div class="toggle-group">
                    <button data-owner="all" class="toggle active"  style="color: #8F4F82;" >All tasks</button>
                    <button data-owner="mine" class="toggle"  style="color: #8F4F82;" >Only my tasks</button>
                    </div>
                </div>

                <div class="filter-row grid-2">
                    <div class="filter-block">
                    <h4>Priority</h4>
                    <div class="options">
                        <button data-priority="high" class="chip" style="color: #8F4F82;">High</button>
                        <button data-priority="medium" class="chip" style="color: #8F4F82;">Medium</button>
                        <button data-priority="low" class="chip" style="color: #8F4F82;">Low</button>
                    </div>
                    </div>

                    <div class="filter-block">
                    <h4>Status</h4>
                    <div class="options">
                        <button data-status="pending" class="chip" style="color: #8F4F82;">Pending</button>
                        <button data-status="progress" class="chip" style="color: #8F4F82;">In Progress</button>
                        <button data-status="completed" class="chip" style="color: #8F4F82;">Completed</button>
                    </div>
                    </div>
                </div>
            </section>
            

                <!-- =========================
                    LISTADO DE TAREAS
                ========================== -->
                <section class="tasks">

                    <h2>All Tasks</h2>
                    <p class="subtitle">Selecciona condiciones para filtrar la lista</p>

                    <section class="task-list">
                        <ul class="tasks" id="tasks"></ul>
                    </section>

                </section>

            </main>
        </div>

    </main>
    <script src="js_jose.js"></script>
</body>
</html>
